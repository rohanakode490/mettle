name: Release Android & Apple Phone (iOS)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Patch Android build config
        run: node scripts/patch-android-build.js

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mettle-android-release
          path: android/app/build/outputs/apk/release/app-release.apk

  build-ios:
    name: Build Apple Phone Installer (iOS IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Unsigned iOS Archive & IPA
        run: |
          cd ios
          xcodebuild -workspace mettle.xcworkspace \
            -scheme mettle \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/mettle.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          mkdir -p build/Payload
          cp -r build/mettle.xcarchive/Products/Applications/mettle.app build/Payload/
          cd build
          zip -qr ../mettle-ios.ipa Payload
          cd ..
          zip -qr mettle-ios-app.zip build/mettle.xcarchive/Products/Applications/mettle.app

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mettle-ios-release
          path: |
            ios/mettle-ios.ipa
            ios/mettle-ios-app.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: mettle-android-release
          path: release-assets/android

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: mettle-ios-release
          path: release-assets/ios

      - name: Prepare Release Files
        run: |
          TAG_NAME="${{ github.ref_name }}"
          mkdir -p dist-release
          
          # Android APK
          if [ -f release-assets/android/app-release.apk ]; then
            cp release-assets/android/app-release.apk dist-release/mettle-${TAG_NAME}-android.apk
          fi
          
          # iOS IPA and App Zip
          if [ -f release-assets/ios/mettle-ios.ipa ]; then
            cp release-assets/ios/mettle-ios.ipa dist-release/mettle-${TAG_NAME}-ios.ipa
          fi
          if [ -f release-assets/ios/mettle-ios-app.zip ]; then
            cp release-assets/ios/mettle-ios-app.zip dist-release/mettle-${TAG_NAME}-ios-app.zip
          fi
          
          echo "Release assets ready for publication:"
          ls -la dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: dist-release/*
